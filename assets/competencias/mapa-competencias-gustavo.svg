<title id="title">Mapa de competências de Gustavo Santos, com radar de oito dimensões e aderência qualitativa a cinco carreiras</title>
<desc id="desc">Planejamento e projetos 5; Gestão de interfaces 5; Negócio e processos 4,5; Comunicação e storytelling 4,5; BI e visualização 5; Integração e ETL 4; Estatística e modelagem 4; IA aplicada e automação 3,5. Aderência alta para Engenharia de Planejamento e Análise de Dados/BI; parcial para Ciência de Dados e Engenharia de Dados; Engenharia de IA em desenvolvimento. Trata-se de autoavaliação qualitativa, não teste padronizado.</desc>

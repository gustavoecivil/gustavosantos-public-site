ext><text x="892" y="774" fill="#4a4640" font-size="19">Agentes e protótipos; produção a comprovar.</text><rect x="892" y="794" width="510" height="15" rx="7.5" fill="#d4d1ca"/><rect x="892" y="794" width="173" height="15" rx="7.5" fill="#2b2b2b"/></g>
